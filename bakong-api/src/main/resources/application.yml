server:
  port: 8080

spring:
  application:
    name: category-service
    
  config:
    import: "optional:file:.env.local[.properties],optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://localhost:5432/bakong
    username: postgres
    password: 1234
    hikari:
      pool-name: CategoryPool
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.connections.pooling: warn

bakong:
  base-url: https://api-bakong.nbc.gov.kh/v1
  token: your_token:(get_from_bakong->https://api-bakong.nbc.gov.kh/register)
